services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rank5
      POSTGRES_PASSWORD: rank5
      POSTGRES_DB: rank5
    ports:
      - "5433:5432"
    volumes:
      - rank5_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rank5"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  rank5_pgdata:
